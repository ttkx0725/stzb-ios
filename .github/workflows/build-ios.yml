name: build-ios-native

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          cmake --version
          xcodebuild -showsdks | grep -i ios || true

      - name: Configure (iOS arm64)
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Verify Mach-O arm64
        run: |
          set -e
          for LIB in $(find build -name '*.dylib'); do
            echo "== $LIB"
            file "$LIB"
            lipo -info "$LIB"
            file "$LIB" | grep -q 'Mach-O 64-bit' || { echo 'NOT Mach-O'; exit 1; }
            lipo -info "$LIB" | grep -q 'arm64'     || { echo 'NOT arm64';  exit 1; }
          done

      - name: Verify cimgui exports (CRITICAL)
        continue-on-error: true
        run: |
          LIB=$(find build -name 'libcimgui.dylib' | head -1)
          echo "libcimgui = $LIB"
          nm -gU "$LIB" > exports.txt 2>/dev/null || nm -g "$LIB" > exports.txt
          wc -l exports.txt
          MISSING=0
          for SYM in _igNewFrame _igRender _igBegin _igEnd _ImFontAtlas_Build _ImFontAtlas_GetTexDataAsRGBA32 _ImGui_ImplMetal_Init _ImGui_ImplMetal_NewFrame _ImGui_ImplMetal_RenderDrawData _igGetIO _igCreateContext; do
            if grep -q "\b$SYM\b" exports.txt; then echo "  OK   $SYM"; else echo "  MISS $SYM"; MISSING=$((MISSING+1)); fi
          done
          echo "missing = $MISSING"
          test "$MISSING" -eq 0

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ios-native
          path: build/**/*.dylib
          if-no-files-found: error
